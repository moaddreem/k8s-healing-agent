# A tiny pod that lives OUTSIDE the demo namespace.
# check.sh execs into it to call the demo services from inside the cluster,
# so faults injected into "demo" can never break the health checker itself.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: lab-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
    spec:
      containers:
        - name: prober
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
