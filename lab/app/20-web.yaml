# web: the public entry point (nginx).
#   GET /         -> "web ok"
#   GET /healthz  -> "ok"
#   GET /api/     -> proxied to the api Service (so an api failure shows up as a web 502)
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      location = /        { return 200 "web ok\n"; }
      location = /healthz { return 200 "ok\n"; }
      location /api/      { proxy_pass http://api.demo.svc.cluster.local/; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
