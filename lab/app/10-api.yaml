# api: a small HTTP service (busybox httpd) that refuses to start without its config.
# It reads GREETING from a ConfigMap and API_TOKEN from a Secret, then serves:
#   GET /         -> the greeting
#   GET /healthz  -> "ok"
# Applied before web (file order) because web's nginx resolves the api Service at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: demo
data:
  GREETING: "hello from api"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: demo
type: Opaque
stringData:
  API_TOKEN: "demo-token-not-a-real-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 2
  progressDeadlineSeconds: 60 # mark a stuck rollout as failed after 60s instead of the default 10min
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$GREETING" ]; then echo "FATAL: required env var GREETING is not set" >&2; exit 1; fi
              if [ -z "$API_TOKEN" ]; then echo "FATAL: required env var API_TOKEN is not set" >&2; exit 1; fi
              mkdir -p /www
              echo "$GREETING" > /www/index.html
              echo ok > /www/healthz
              echo "api listening on :8080"
              exec httpd -f -v -p 8080 -h /www
          envFrom:
            - configMapRef:
                name: api-config # every key in the ConfigMap becomes an env var
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: API_TOKEN
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
