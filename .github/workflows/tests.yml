# Run Nabd's offline safety tests on every push and pull request (no cluster or API key needed).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile nabd/*.py bench/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
